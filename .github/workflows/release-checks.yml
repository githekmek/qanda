name: Release checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qanda
          POSTGRES_PASSWORD: isolated-test-password
          POSTGRES_DB: qanda_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qanda -d qanda_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://qanda:isolated-test-password@localhost:5432/qanda_test
      SESSION_SECRET: isolated-ci-session-secret-at-least-32-characters
      QANDA_BROWSER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:migrations
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration
