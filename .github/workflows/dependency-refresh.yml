name: Prepare dependency lockfile
on:
  push:
    branches: ["codex/security-fixes-20260925"]
    paths: [".github/workflows/dependency-refresh.yml"]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve security patches
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.dependencies.next = '16.3.8';
          p.devDependencies['eslint-config-next'] = '16.3.8';
          p.overrides.sharp = '0.35.5';
          p.overrides['source-map-js'] = '1.2.2';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          JS
          npm install --package-lock-only --ignore-scripts --no-audit
      - name: Export resolved manifests
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          for (const file of ['package.json','package-lock.json']) {
            console.log('QANDA_FILE ' + file + ' ' + JSON.stringify(JSON.parse(fs.readFileSync(file,'utf8'))));
          }
          JS
      - name: Audit resolved tree
        run: npm audit --json
